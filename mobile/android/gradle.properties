org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false

# Windows: when the project (e.g. D:\) and the pub cache with the plugins'
# Kotlin sources (C:\Users\…\AppData\Local\Pub\Cache) are on different
# drives, Kotlin's incremental caches fail with "Could not close incremental
# caches … class-fq-name-to-source.tab" (paths with different roots). Our own
# Kotlin code is a single MainActivity, so full Kotlin compiles cost little.
kotlin.incremental=false
