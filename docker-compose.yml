# Local development services (ADR-0001, roadmap 1.2).
# Compose v2 / Compose Specification: no top-level `version:` key.
#
# All credentials come from the environment: copy .env.example to .env
# (`make up` does this for you) and Compose reads it automatically.
# Ports are bound to 127.0.0.1 only, so the dev services are never exposed
# on the network.

name: brainvolt

services:
  postgres:
    image: postgres:18.6-alpine
    container_name: brainvolt_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${BRAINVOLT_POSTGRES_USER:?set BRAINVOLT_POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${BRAINVOLT_POSTGRES_PASSWORD:?set BRAINVOLT_POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${BRAINVOLT_POSTGRES_DB:?set BRAINVOLT_POSTGRES_DB in .env}
    ports:
      - "127.0.0.1:${BRAINVOLT_POSTGRES_PORT:-5432}:5432"
    volumes:
      # PostgreSQL 18 images keep data in /var/lib/postgresql/18/docker, so the
      # volume mounts the parent directory (not /var/lib/postgresql/data as in <= 17).
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  redis:
    image: redis:8.10.2-alpine
    container_name: brainvolt_redis
    restart: unless-stopped
    # Persistence and eviction policy from docs/domain/redis-keys.md §1:
    # AOF with fsync every second + RDB snapshots, and noeviction so live
    # match state is never silently dropped.
    command:
      - redis-server
      - --requirepass
      - ${BRAINVOLT_REDIS_PASSWORD:?set BRAINVOLT_REDIS_PASSWORD in .env}
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
      - --save
      - 3600 1 300 100 60 10000
      - --maxmemory-policy
      - noeviction
      - --dir
      - /data
    environment:
      # Lets redis-cli inside the container (healthcheck, `make redis-cli`) authenticate.
      REDISCLI_AUTH: ${BRAINVOLT_REDIS_PASSWORD}
    ports:
      - "127.0.0.1:${BRAINVOLT_REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  # Firebase Auth Emulator (ADR-0003): local sign-ups never reach the real
  # `brainvolt` project. The backend finds it via FIREBASE_AUTH_EMULATOR_HOST.
  firebase-auth:
    build:
      context: ./scripts/firebase-emulator
    image: brainvolt/firebase-auth-emulator:local
    container_name: brainvolt_firebase_auth
    restart: unless-stopped
    environment:
      FIREBASE_PROJECT_ID: ${BRAINVOLT_FIREBASE_PROJECT_ID:?set BRAINVOLT_FIREBASE_PROJECT_ID in .env}
    ports:
      - "127.0.0.1:${BRAINVOLT_FIREBASE_AUTH_EMULATOR_PORT:-9099}:9099"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9099/"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 15s

volumes:
  postgres_data:
  redis_data:
