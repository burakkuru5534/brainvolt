version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: brainvolt_postgres
    environment:
      POSTGRES_USER: brainvolt
      POSTGRES_PASSWORD: brainvolt_secret
      POSTGRES_DB: brainvolt_db
    ports:
      - "5432:5432"

  redis:
    image: redis:7-alpine
    container_name: brainvolt_redis
    ports:
      - "6379:6379"