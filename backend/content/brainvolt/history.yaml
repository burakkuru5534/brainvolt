# BrainVolt team pool — History. Format: content/README.md.
# Multiple choice: the first option is the correct one (matches shuffle).
source: brainvolt-team
questions:
  - ref: bv-history-001
    subcategory: history/ottoman-empire
    difficulty: 1
    tr:
      prompt: İstanbul, Osmanlılar tarafından hangi yıl fethedildi?
      options: ["1453", "1071", "1299", "1517"]
      explanation: Fatih Sultan Mehmet 29 Mayıs 1453'te İstanbul'u fethetti.
    en:
      prompt: In which year did the Ottomans conquer Constantinople (Istanbul)?
      options: ["1453", "1071", "1299", "1517"]
      explanation: Sultan Mehmed II took the city on 29 May 1453.

