components:
    schemas:
        Deletion:
            properties:
                purge_after:
                    format: date-time
                    type: string
                requested_at:
                    format: date-time
                    type: string
            required:
                - purge_after
                - requested_at
            type: object
        Device:
            properties:
                app_version:
                    type: string
                installation_id:
                    type: string
                last_seen_at:
                    format: date-time
                    type: string
                locale:
                    type: string
                platform:
                    type: string
                push_enabled:
                    type: boolean
            required:
                - app_version
                - installation_id
                - last_seen_at
                - locale
                - platform
                - push_enabled
            type: object
        DeviceRequest:
            properties:
                app_version:
                    type: string
                fcm_token:
                    type:
                        - string
                        - "null"
                installation_id:
                    type: string
                locale:
                    type: string
                platform:
                    type: string
            required:
                - app_version
                - installation_id
                - locale
                - platform
            type: object
        ErrorEnvelope:
            properties:
                error:
                    properties:
                        code:
                            description: Stable code from docs/api/errors.md
                            type: string
                        details:
                            additionalProperties: true
                            type: object
                        message:
                            description: Localized fallback text (Accept-Language)
                            type: string
                        request_id:
                            format: uuid
                            type: string
                    required:
                        - code
                        - message
                        - request_id
                    type: object
            required:
                - error
            type: object
        Liveness:
            properties:
                status:
                    type: string
            required:
                - status
            type: object
        Me:
            properties:
                profile:
                    $ref: '#/components/schemas/OwnProfile'
                settings:
                    $ref: '#/components/schemas/Settings'
                user:
                    $ref: '#/components/schemas/User'
            required:
                - profile
                - settings
                - user
            type: object
        OwnProfile:
            properties:
                avatar_id:
                    type: string
                country_change_available_at:
                    format: date-time
                    type:
                        - string
                        - "null"
                country_code:
                    type:
                        - string
                        - "null"
                display_name:
                    type: string
                locale:
                    type: string
                username:
                    type: string
                username_change_available_at:
                    format: date-time
                    type:
                        - string
                        - "null"
            required:
                - avatar_id
                - country_change_available_at
                - country_code
                - display_name
                - locale
                - username
                - username_change_available_at
            type: object
        ProfileRequest:
            properties:
                avatar_id:
                    type:
                        - string
                        - "null"
                country_code:
                    type:
                        - string
                        - "null"
                display_name:
                    type:
                        - string
                        - "null"
                locale:
                    type:
                        - string
                        - "null"
                username:
                    type:
                        - string
                        - "null"
            type: object
        ProfileSummary:
            properties:
                avatar_id:
                    type: string
                country_code:
                    type:
                        - string
                        - "null"
                display_name:
                    type: string
                locale:
                    type: string
                username:
                    type: string
            required:
                - avatar_id
                - country_code
                - display_name
                - locale
                - username
            type: object
        PublicProfile:
            properties:
                avatar_id:
                    type: string
                country_code:
                    type:
                        - string
                        - "null"
                display_name:
                    type: string
                user_id:
                    format: uuid
                    type: string
                username:
                    type: string
            required:
                - avatar_id
                - country_code
                - display_name
                - user_id
                - username
            type: object
        Readiness:
            properties:
                checks:
                    additionalProperties:
                        type: string
                    type: object
                status:
                    type: string
            required:
                - checks
                - status
            type: object
        SessionFlags:
            properties:
                created:
                    type: boolean
                deletion_pending:
                    type: boolean
                email_verification_required:
                    type: boolean
                restricted:
                    type: boolean
                suspended:
                    type: boolean
            required:
                - created
                - deletion_pending
                - email_verification_required
                - restricted
                - suspended
            type: object
        SessionRequest:
            properties:
                age_confirmed:
                    type:
                        - boolean
                        - "null"
                app_version:
                    type: string
                country_hint:
                    type:
                        - string
                        - "null"
                installation_id:
                    type: string
                locale:
                    type: string
                platform:
                    type: string
            required:
                - age_confirmed
                - app_version
                - installation_id
                - locale
                - platform
            type: object
        SessionResponse:
            properties:
                flags:
                    $ref: '#/components/schemas/SessionFlags'
                profile:
                    $ref: '#/components/schemas/ProfileSummary'
                status:
                    enum:
                        - active
                        - suspended
                        - deleted
                    type: string
                tier:
                    enum:
                        - guest
                        - unverified
                        - full
                    type: string
                user:
                    $ref: '#/components/schemas/User'
            required:
                - flags
                - profile
                - status
                - tier
                - user
            type: object
        Settings:
            properties:
                allow_friend_requests:
                    type: boolean
                challenges_from:
                    type: string
                haptics_enabled:
                    type: boolean
                music_enabled:
                    type: boolean
                show_online_status:
                    type: boolean
                sound_enabled:
                    type: boolean
            required:
                - allow_friend_requests
                - challenges_from
                - haptics_enabled
                - music_enabled
                - show_online_status
                - sound_enabled
            type: object
        SettingsRequest:
            properties:
                allow_friend_requests:
                    type:
                        - boolean
                        - "null"
                challenges_from:
                    type:
                        - string
                        - "null"
                haptics_enabled:
                    type:
                        - boolean
                        - "null"
                music_enabled:
                    type:
                        - boolean
                        - "null"
                show_online_status:
                    type:
                        - boolean
                        - "null"
                sound_enabled:
                    type:
                        - boolean
                        - "null"
            type: object
        User:
            properties:
                created_at:
                    format: date-time
                    type: string
                deletion_requested_at:
                    format: date-time
                    type:
                        - string
                        - "null"
                id:
                    format: uuid
                    type: string
                roles:
                    items:
                        type: string
                    type: array
                status:
                    enum:
                        - active
                        - suspended
                        - deleted
                    type: string
                tier:
                    enum:
                        - guest
                        - unverified
                        - full
                    type: string
                upgraded_at:
                    format: date-time
                    type:
                        - string
                        - "null"
            required:
                - created_at
                - deletion_requested_at
                - id
                - roles
                - status
                - tier
                - upgraded_at
            type: object
    securitySchemes:
        firebase:
            bearerFormat: Firebase ID token
            scheme: bearer
            type: http
info:
    description: 'Generated from the backend code (internal/app/openapi.go); do not edit by hand. Conventions: docs/api/conventions.md, error codes: docs/api/errors.md.'
    title: BrainVolt API
    version: v1
openapi: 3.1.0
paths:
    /healthz:
        get:
            operationId: getHealthz
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Liveness'
                    description: OK
            summary: 'Liveness: the process is up'
            tags:
                - health
            x-auth: public
    /readyz:
        get:
            operationId: getReadyz
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Readiness'
                    description: OK
                "503":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorEnvelope'
                    description: 'Error codes: UNAVAILABLE'
            summary: 'Readiness: Postgres, Redis and migrations; 503 lists the failed checks'
            tags:
                - health
            x-auth: public
    /v1/me:
        get:
            operationId: getV1Me
            parameters:
                - in: header
                  name: Accept-Language
                  required: false
                  schema:
                    enum:
                        - tr
                        - en
                    type: string
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Me'
                    description: OK
                "400":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorEnvelope'
                    description: 'Error codes: MALFORMED_REQUEST'
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorEnvelope'
                    description: 'Error codes: TOKEN_EXPIRED, UNAUTHENTICATED'
                "429":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorEnvelope'
                    description: 'Error codes: RATE_LIMITED'
                "500":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorEnvelope'
                    description: 'Error codes: INTERNAL'
                "503":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorEnvelope'
                    description: 'Error codes: UNAVAILABLE'
            security:
                - firebase: []
            summary: Own user, profile and settings
            tags:
                - profile
            x-auth: any
    /v1/me/deletion:
        delete:
            operationId: deleteV1MeDeletion
            parameters:
                - in: header
                  name: Accept-Language
                  required: false
                  schema:
                    enum:
                        - tr
                        - en
                    type: string
            responses:
                "204":
                    description: No Content
                "400":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorEnvelope'
                    description: 'Error codes: MALFORMED_REQUEST'
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorEnvelope'
                    description: 'Error codes: TOKEN_EXPIRED, UNAUTHENTICATED'
                "429":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorEnvelope'
                    description: 'Error codes: RATE_LIMITED'
                "500":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorEnvelope'
                    description: 'Error codes: INTERNAL'
                "503":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorEnvelope'
                    description: 'Error codes: UNAVAILABLE'
            security:
                - firebase: []
            summary: Cancel a pending account deletion
            tags:
                - identity
            x-auth: any
        post:
            operationId: postV1MeDeletion
            parameters:
                - in: header
                  name: Accept-Language
                  required: false
                  schema:
                    enum:
                        - tr
                        - en
                    type: string
                - description: Client-generated UUID; repeats within 24 h replay the stored response (conventions.md §9)
                  in: header
                  name: Idempotency-Key
                  required: true
                  schema:
                    format: uuid
                    type: string
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Deletion'
                    description: OK
                "400":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorEnvelope'
                    description: 'Error codes: MALFORMED_REQUEST, VALIDATION_FAILED'
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorEnvelope'
                    description: 'Error codes: TOKEN_EXPIRED, UNAUTHENTICATED'
                "409":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorEnvelope'
                    description: 'Error codes: IDEMPOTENCY_KEY_REUSED, IDEMPOTENT_REQUEST_IN_PROGRESS'
                "429":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorEnvelope'
                    description: 'Error codes: RATE_LIMITED'
                "500":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorEnvelope'
                    description: 'Error codes: INTERNAL'
                "503":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorEnvelope'
                    description: 'Error codes: UNAVAILABLE'
            security:
                - firebase: []
            summary: Request account deletion (14-day cooling-off, D-022)
            tags:
                - identity
            x-auth: any
