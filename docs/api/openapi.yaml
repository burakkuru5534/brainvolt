components:
    schemas:
        AnswerView:
            properties:
                correct:
                    type: boolean
                option_id:
                    format: uuid
                    type:
                        - string
                        - "null"
                points:
                    type: integer
                response_ms:
                    type:
                        - integer
                        - "null"
                user_id:
                    format: uuid
                    type: string
            required:
                - correct
                - option_id
                - points
                - response_ms
                - user_id
            type: object
        BlockRequest:
            properties:
                user_id:
                    format: uuid
                    type: string
            required:
                - user_id
            type: object
        BlockedUser:
            properties:
                Card:
                    $ref: '#/components/schemas/Card'
                since:
                    format: date-time
                    type: string
            required:
                - Card
                - since
            type: object
        Blocks:
            properties:
                blocks:
                    items:
                        $ref: '#/components/schemas/BlockedUser'
                    type: array
            required:
                - blocks
            type: object
        Card:
            properties:
                avatar_id:
                    type: string
                country_code:
                    type:
                        - string
                        - "null"
                display_name:
                    type: string
                user_id:
                    format: uuid
                    type: string
                username:
                    type: string
            required:
                - avatar_id
                - country_code
                - display_name
                - user_id
                - username
            type: object
        Catalog:
            properties:
                categories:
                    items:
                        $ref: '#/components/schemas/Category'
                    type: array
                locale:
                    type: string
            required:
                - categories
                - locale
            type: object
        Category:
            properties:
                description:
                    type:
                        - string
                        - "null"
                eligible:
                    $ref: '#/components/schemas/Counts'
                icon_key:
                    type: string
                id:
                    format: uuid
                    type: string
                name:
                    type: string
                slug:
                    type: string
                subcategories:
                    items:
                        $ref: '#/components/schemas/Subcategory'
                    type: array
            required:
                - description
                - eligible
                - icon_key
                - id
                - name
                - slug
                - subcategories
            type: object
        Challenge:
            properties:
                challenger:
                    $ref: '#/components/schemas/Card'
                challenger_couple_id:
                    format: uuid
                    type:
                        - string
                        - "null"
                challenger_side:
                    items:
                        $ref: '#/components/schemas/Card'
                    type: array
                created_at:
                    format: date-time
                    type: string
                expires_at:
                    format: date-time
                    type: string
                id:
                    format: uuid
                    type: string
                kind:
                    type: string
                match_config:
                    $ref: '#/components/schemas/Config'
                match_id:
                    format: uuid
                    type:
                        - string
                        - "null"
                status:
                    type: string
                target:
                    $ref: '#/components/schemas/Card'
                target_couple_id:
                    format: uuid
                    type:
                        - string
                        - "null"
                target_side:
                    items:
                        $ref: '#/components/schemas/Card'
                    type: array
