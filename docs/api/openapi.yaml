                    type: string
                platform:
                    type: string
            required:
                - app_version
                - installation_id
                - locale
                - platform
            type: object
        ErrorEnvelope:
            properties:
                error:
                    properties:
                        code:
                            description: Stable code from docs/api/errors.md
                            type: string
                        details:
                            additionalProperties: true
                            type: object
                        message:
                            description: Localized fallback text (Accept-Language)
                            type: string
                        request_id:
                            format: uuid
                            type: string
                    required:
                        - code
                        - message
                        - request_id
                    type: object
            required:
                - error
            type: object
