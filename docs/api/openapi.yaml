components:
    schemas:
        AnswerView:
            properties:
                correct:
                    type: boolean
                option_id:
                    format: uuid
                    type:
                        - string
                        - "null"
                points:
                    type: integer
                response_ms:
                    type:
                        - integer
                        - "null"
                user_id:
                    format: uuid
                    type: string
            required:
                - correct
                - option_id
                - points
                - response_ms
                - user_id
            type: object
        Catalog:
            properties:
                categories:
                    items:
                        $ref: '#/components/schemas/Category'
                    type: array
                locale:
                    type: string
            required:
                - categories
                - locale
            type: object
        Category:
            properties:
                description:
                    type:
                        - string
                        - "null"
                eligible:
                    $ref: '#/components/schemas/Counts'
                icon_key:
                    type: string
                id:
                    format: uuid
                    type: string
                name:
                    type: string
                slug:
                    type: string
                subcategories:
                    items:
                        $ref: '#/components/schemas/Subcategory'
                    type: array
            required:
                - description
                - eligible
                - icon_key
                - id
                - name
                - slug
                - subcategories
            type: object
        Counts:
            properties:
                casual:
                    type: integer
                ranked:
                    type: integer
            required:
                - casual
                - ranked
            type: object
        Credit:
            properties:
                attribution_text:
                    type: string
                license_code:
                    type: string
                license_url:
                    type:
                        - string
                        - "null"
                name:
                    type: string
                share_alike:
                    type: boolean
                url:
                    type:
                        - string
                        - "null"
            required:
                - attribution_text
                - license_code
                - license_url
                - name
                - share_alike
                - url
            type: object
        Credits:
            properties:
                sources:
                    items:
                        $ref: '#/components/schemas/Credit'
                    type: array
            required:
                - sources
            type: object
        Current:
            properties:
                match:
                    oneOf:
                        - $ref: '#/components/schemas/CurrentMatch'
                        - type: "null"
            required:
                - match
            type: object
        CurrentMatch:
            properties:
                id:
                    format: uuid
                    type: string
                status:
                    type: string
                stream:
                    type: string
            required:
                - id
                - status
                - stream
            type: object
        Deletion:
            properties:
                purge_after:
                    format: date-time
                    type: string
                requested_at:
                    format: date-time
                    type: string
            required:
                - purge_after
                - requested_at
            type: object
        Device:
            properties:
                app_version:
                    type: string
                installation_id:
                    type: string
                last_seen_at:
                    format: date-time
                    type: string
                locale:
                    type: string
                platform:
                    type: string
                push_enabled:
                    type: boolean
            required:
                - app_version
                - installation_id
                - last_seen_at
                - locale
                - platform
                - push_enabled
            type: object
        DeviceRequest:
            properties:
                app_version:
                    type: string
                fcm_token:
                    type:
                        - string
                        - "null"
                installation_id:
                    type: string
                locale:
                    type: string
                platform:
                    type: string
            required:
                - app_version
                - installation_id
                - locale
                - platform
            type: object
        ErrorEnvelope:
            properties:
                error:
                    properties:
                        code:
                            description: Stable code from docs/api/errors.md
                            type: string
                        details:
                            additionalProperties: true
                            type: object
                        message:
                            description: Localized fallback text (Accept-Language)
                            type: string
                        request_id:
                            format: uuid
                            type: string
                    required:
                        - code
                        - message
                        - request_id
                    type: object
            required:
                - error
            type: object
        Liveness:
            properties:
                status:
                    type: string
            required:
                - status
            type: object
        MatchView:
            properties:
                cancel_reason:
                    type:
                        - string
                        - "null"
                category_mode:
                    type:
                        - string
                        - "null"
                created_at:
                    format: date-time
                    type: string
                end_reason:
                    type:
                        - string
                        - "null"
                ended_at:
                    format: date-time
                    type:
                        - string
                        - "null"
                format:
                    type: string
                id:
                    format: uuid
                    type: string
                is_draw:
                    type: boolean
                is_rated:
                    type: boolean
                match_type:
                    type: string
                origin:
                    type: string
                participants:
                    items:
                        $ref: '#/components/schemas/ParticipantView'
                    type: array
                rounds:
                    items:
                        $ref: '#/components/schemas/RoundView'
                    type: array
                sides:
                    items:
                        $ref: '#/components/schemas/SideView'
                    type: array
                started_at:
                    format: date-time
                    type:
                        - string
                        - "null"
                status:
                    type: string
                winner_side_no:
                    type:
                        - integer
                        - "null"
            required:
                - cancel_reason
                - category_mode
                - created_at
                - end_reason
                - ended_at
                - format
                - id
                - is_draw
                - is_rated
                - match_type
                - origin
                - participants
                - rounds
                - sides
                - started_at
                - status
                - winner_side_no
            type: object
        Me:
            properties:
                profile:
                    $ref: '#/components/schemas/OwnProfile'
                settings:
                    $ref: '#/components/schemas/Settings'
                user:
                    $ref: '#/components/schemas/User'
            required:
                - profile
                - settings
                - user
            type: object
        Option:
            properties:
                id:
                    format: uuid
                    type: string
                is_correct:
                    type: boolean
                position:
                    type: integer
            required:
                - id
                - is_correct
                - position
            type: object
        OptionView:
            properties:
                id:
                    format: uuid
                    type: string
                text:
