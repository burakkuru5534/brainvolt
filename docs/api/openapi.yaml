                platform:
                    type: string
                push_enabled:
                    type: boolean
            required:
                - app_version
                - installation_id
                - last_seen_at
                - locale
                - platform
                - push_enabled
            type: object
        DeviceRequest:
            properties:
                app_version:
                    type: string
