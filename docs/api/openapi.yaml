                    description: 'Error codes: INTERNAL'
                "503":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorEnvelope'
                    description: 'Error codes: UNAVAILABLE'
            security:
                - firebase: []
            summary: Register or refresh this device and its FCM token; the device moves to the caller if another account used it
            tags:
                - notification
            x-auth: any
    /v1/me/devices/{installation_id}:
