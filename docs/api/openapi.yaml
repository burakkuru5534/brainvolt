info:
    description: 'Generated from the backend code (internal/app/openapi.go); do not edit by hand. Conventions: docs/api/conventions.md, error codes: docs/api/errors.md.'
    title: BrainVolt API
    version: v1
openapi: 3.1.0
paths:
    /healthz:
        get:
            operationId: getHealthz
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Liveness'
                    description: OK
            summary: 'Liveness: the process is up'
            tags:
                - health
            x-auth: public
    /readyz:
        get:
            operationId: getReadyz
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Readiness'
                    description: OK
                "503":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorEnvelope'
                    description: 'Error codes: UNAVAILABLE'
            summary: 'Readiness: Postgres, Redis and migrations; 503 lists the failed checks'
            tags:
                - health
            x-auth: public
    /v1/categories:
        get:
            operationId: getV1Categories
            parameters:
                - in: header
                  name: Accept-Language
                  required: false
                  schema:
                    enum:
                        - tr
                        - en
                    type: string
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Catalog'
                    description: OK
                "400":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorEnvelope'
                    description: 'Error codes: MALFORMED_REQUEST'
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorEnvelope'
                    description: 'Error codes: TOKEN_EXPIRED, UNAUTHENTICATED'
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorEnvelope'
                    description: 'Error codes: ACCOUNT_DELETION_PENDING, ACCOUNT_SUSPENDED'
                "429":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorEnvelope'
                    description: 'Error codes: RATE_LIMITED'
                "500":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorEnvelope'
                    description: 'Error codes: INTERNAL'
                "503":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorEnvelope'
                    description: 'Error codes: UNAVAILABLE'
            security:
                - firebase: []
            summary: Categories and sub-categories in the caller's language with eligible question counts (ranked / casual); ETag + If-None-Match
            tags:
                - content
            x-auth: any
    /v1/credits:
        get:
            operationId: getV1Credits
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Credits'
                    description: OK
