components:
    schemas:
        ActionInput:
            properties:
                action:
                    type: string
                note:
                    type: string
                sanction:
                    oneOf:
                        - $ref: '#/components/schemas/SanctionInput'
                        - type: "null"
                sanction_id:
                    format: uuid
                    type:
                        - string
                        - "null"
            required:
                - action
            type: object
        ActionView:
            properties:
                action:
                    type: string
                actor_id:
                    format: uuid
                    type:
                        - string
                        - "null"
                actor_kind:
                    type: string
                created_at:
                    format: date-time
                    type: string
                id:
                    format: uuid
                    type: string
                payload:
                    additionalProperties: {}
                    type: object
            required:
                - action
                - actor_kind
                - created_at
                - id
                - payload
            type: object
        AnswerView:
            properties:
                correct:
                    type: boolean
                option_id:
                    format: uuid
                    type:
                        - string
                        - "null"
                points:
                    type: integer
                response_ms:
                    type:
                        - integer
                        - "null"
                user_id:
                    format: uuid
                    type: string
            required:
                - correct
                - option_id
                - points
                - response_ms
                - user_id
            type: object
        AppealInput:
            properties:
                text:
                    type: string
            required:
                - text
            type: object
        AppealView:
            properties:
                created_at:
                    format: date-time
                    type: string
                id:
                    format: uuid
                    type: string
                reason_code:
                    type: string
                sanction_id:
                    format: uuid
                    type: string
                sanction_kind:
                    type: string
                text:
                    type: string
                user_id:
                    format: uuid
                    type: string
            required:
                - created_at
                - id
                - reason_code
                - sanction_id
                - sanction_kind
                - text
                - user_id
            type: object
        Appeals:
            properties:
                appeals:
                    items:
                        $ref: '#/components/schemas/AppealView'
                    type: array
            required:
                - appeals
            type: object
        Awards:
            properties:
                badges:
                    items:
                        $ref: '#/components/schemas/EarnedBadge'
                    type: array
                level:
                    type: integer
                level_up:
                    type: boolean
                match_id:
                    format: uuid
                    type: string
                quests:
                    items:
                        $ref: '#/components/schemas/QuestProgress'
                    type: array
                streak:
                    type: integer
                xp:
                    type: integer
                xp_total:
                    type: integer
            required:
                - badges
                - level
                - level_up
                - match_id
                - quests
                - streak
                - xp
                - xp_total
            type: object
        Badge:
            properties:
                code:
                    type: string
                description:
                    type: string
                earned_at:
                    format: date-time
                    type:
                        - string
                        - "null"
                family:
                    type: string
                icon_key:
                    type: string
                name:
                    type: string
                tier:
                    type: integer
            required:
                - code
                - description
                - earned_at
                - family
                - icon_key
                - name
                - tier
            type: object
        Badges:
            properties:
                badges:
                    items:
                        $ref: '#/components/schemas/Badge'
                    type: array
            required:
                - badges
            type: object
        BlockRequest:
            properties:
                user_id:
                    format: uuid
                    type: string
            required:
                - user_id
            type: object
        BlockedUser:
            properties:
                Card:
                    $ref: '#/components/schemas/Card'
                since:
                    format: date-time
                    type: string
            required:
                - Card
                - since
            type: object
        Blocks:
            properties:
                blocks:
                    items:
                        $ref: '#/components/schemas/BlockedUser'
                    type: array
            required:
                - blocks
            type: object
        Board:
            properties:
                category_id:
                    format: uuid
                    type:
                        - string
                        - "null"
                country:
                    type:
                        - string
                        - "null"
                ends_at:
                    format: date-time
                    type:
                        - string
                        - "null"
                entity:
                    type: string
                entries:
                    items:
                        $ref: '#/components/schemas/Entry'
                    type: array
                me:
                    oneOf:
                        - $ref: '#/components/schemas/Entry'
                        - type: "null"
                next_cursor:
                    type:
                        - string
                        - "null"
                period:
                    type: string
                period_id:
                    type: string
                scope:
                    type: string
                starts_at:
                    format: date-time
                    type:
                        - string
                        - "null"
            required:
                - entity
                - entries
                - me
                - next_cursor
                - period
                - period_id
                - scope
            type: object
        Card:
            properties:
                avatar_id:
                    type: string
                country_code:
                    type:
                        - string
                        - "null"
                display_name:
                    type: string
                user_id:
                    format: uuid
                    type: string
                username:
                    type: string
            required:
                - avatar_id
                - country_code
                - display_name
                - user_id
                - username
            type: object
        Case:
            properties:
                assigned_to:
                    format: uuid
                    type:
                        - string
                        - "null"
                id:
                    format: uuid
                    type: string
                opened_at:
                    format: date-time
                    type: string
                priority:
                    type: integer
                report_count:
                    type: integer
                resolution:
                    type:
                        - string
                        - "null"
                resolution_note:
                    type:
                        - string
                        - "null"
                resolved_at:
                    format: date-time
                    type:
                        - string
                        - "null"
                signal_count:
                    type: integer
                status:
                    type: string
                target_id:
                    format: uuid
                    type: string
                target_kind:
                    type: string
                target_locale:
                    type:
                        - string
                        - "null"
            required:
                - id
                - opened_at
                - priority
                - report_count
                - signal_count
                - status
                - target_id
                - target_kind
            type: object
        CaseDetail:
            properties:
                case:
                    $ref: '#/components/schemas/Case'
                history:
                    items:
                        $ref: '#/components/schemas/ActionView'
                    type: array
                reports:
                    items:
                        $ref: '#/components/schemas/ReportView'
                    type: array
                signals:
                    items:
                        $ref: '#/components/schemas/SignalView'
                    type: array
            required:
                - case
                - history
                - reports
                - signals
            type: object
        Cases:
            properties:
                cases:
                    items:
                        $ref: '#/components/schemas/Case'
                    type: array
                next_cursor:
                    type:
                        - string
                        - "null"
            required:
                - cases
                - next_cursor
            type: object
        Catalog:
            properties:
                categories:
                    items:
                        $ref: '#/components/schemas/Category'
                    type: array
                locale:
                    type: string
            required:
                - categories
                - locale
            type: object
        Category:
            properties:
                description:
                    type:
                        - string
                        - "null"
                eligible:
                    $ref: '#/components/schemas/Counts'
                icon_key:
                    type: string
                id:
                    format: uuid
                    type: string
                name:
                    type: string
                slug:
                    type: string
                subcategories:
                    items:
                        $ref: '#/components/schemas/Subcategory'
                    type: array
            required:
                - description
                - eligible
                - icon_key
                - id
                - name
                - slug
                - subcategories
            type: object
        CategoryPref:
            properties:
                category:
                    type: string
                in_app:
                    type: boolean
                locked:
                    type: boolean
                push:
                    type: boolean
            required:
                - category
                - in_app
                - locked
                - push
            type: object
        Challenge:
            properties:
                challenger:
                    $ref: '#/components/schemas/Card'
                challenger_couple_id:
                    format: uuid
                    type:
                        - string
                        - "null"
                challenger_side:
                    items:
                        $ref: '#/components/schemas/Card'
                    type: array
                created_at:
                    format: date-time
                    type: string
                expires_at:
                    format: date-time
                    type: string
                id:
                    format: uuid
                    type: string
                kind:
                    type: string
                match_config:
                    $ref: '#/components/schemas/Config'
                match_id:
                    format: uuid
                    type:
                        - string
                        - "null"
                parent_match_id:
                    format: uuid
                    type:
                        - string
                        - "null"
                status:
                    type: string
                target:
                    $ref: '#/components/schemas/Card'
                target_couple_id:
                    format: uuid
                    type:
                        - string
                        - "null"
                target_side:
                    items:
                        $ref: '#/components/schemas/Card'
                    type: array
            required:
                - challenger
                - challenger_side
                - created_at
                - expires_at
                - id
                - kind
                - match_config
                - status
                - target
                - target_side
            type: object
        ChallengeRequest:
            properties:
                match_config:
                    $ref: '#/components/schemas/Config'
                target_couple_id:
                    format: uuid
                    type:
                        - string
                        - "null"
                target_user_id:
                    format: uuid
                    type:
                        - string
                        - "null"
            required:
                - match_config
            type: object
        Challenges:
            properties:
                challenges:
                    items:
                        $ref: '#/components/schemas/Challenge'
                    type: array
            required:
                - challenges
            type: object
        Channel:
            properties:
                couple_id:
                    format: uuid
                    type:
                        - string
                        - "null"
                id:
                    format: uuid
                    type: string
                kind:
                    type: string
                members:
                    items:
                        $ref: '#/components/schemas/Card'
                    type: array
                team_id:
                    format: uuid
                    type:
                        - string
                        - "null"
                unread:
                    type: integer
            required:
                - id
                - kind
                - members
                - unread
            type: object
        ChatReadInput:
            properties:
                last_read_id:
                    format: uuid
                    type: string
            required:
                - last_read_id
            type: object
        Claimed:
            properties:
                level:
                    type: integer
                level_up:
                    type: boolean
                xp:
                    type: integer
            required:
                - level
                - level_up
                - xp
            type: object
        CodeRequest:
            properties:
                kind:
                    type: string
            required:
                - kind
            type: object
        Config:
            properties:
                aggregation:
                    type: string
                category_ids:
                    items:
                        format: uuid
                        type: string
                    type: array
                category_mode:
                    type: string
                creator_quiz_id:
                    format: uuid
                    type:
                        - string
                        - "null"
                format:
                    type: string
                match_type:
                    type: string
                origin:
                    type: string
                question_set_id:
                    format: uuid
                    type:
                        - string
                        - "null"
                quiz_author_id:
                    format: uuid
                    type:
                        - string
                        - "null"
                quiz_length:
                    type: integer
                quiz_locale:
                    type: string
                quiz_published:
                    type: boolean
                quiz_window_ms:
                    type: integer
                ranked_length:
                    type: boolean
                subcategory_id:
                    format: uuid
                    type:
                        - string
                        - "null"
                team_answer_mode:
                    type: string
            required:
                - format
                - match_type
                - origin
            type: object
        Counts:
            properties:
                casual:
                    type: integer
                ranked:
                    type: integer
            required:
                - casual
                - ranked
            type: object
        Couple:
            properties:
                activated_at:
                    format: date-time
                    type:
                        - string
                        - "null"
                created_at:
                    format: date-time
                    type: string
                expires_at:
                    format: date-time
                    type:
                        - string
                        - "null"
                id:
                    format: uuid
                    type: string
                name:
                    type:
                        - string
                        - "null"
                partners:
                    items:
                        $ref: '#/components/schemas/Card'
                    type: array
                requested_at:
                    format: date-time
                    type: string
                requested_by:
                    format: uuid
                    type: string
                status:
                    type: string
            required:
                - activated_at
                - created_at
                - id
                - name
                - partners
                - requested_at
                - requested_by
                - status
            type: object
        CoupleLabel:
            properties:
                name:
                    type: string
                partners:
                    items:
                        $ref: '#/components/schemas/Card'
                    type: array
            required:
                - partners
            type: object
        CoupleRequest:
            properties:
                name:
                    type:
                        - string
                        - "null"
                partner_user_id:
                    format: uuid
                    type: string
            required:
                - partner_user_id
            type: object
        CreatorQuestion:
            properties:
                correct:
                    type: integer
                options:
                    items:
                        type: string
                    type: array
                prompt:
                    type: string
                type:
                    type: string
            required:
                - correct
                - options
                - prompt
                - type
            type: object
        Credit:
            properties:
                attribution_text:
                    type: string
                license_code:
                    type: string
                license_url:
                    type:
                        - string
                        - "null"
                name:
                    type: string
                share_alike:
                    type: boolean
                url:
                    type:
                        - string
                        - "null"
            required:
                - attribution_text
                - license_code
                - license_url
                - name
                - share_alike
                - url
            type: object
        Credits:
            properties:
                sources:
                    items:
                        $ref: '#/components/schemas/Credit'
                    type: array
            required:
                - sources
            type: object
        Current:
            properties:
                match:
                    oneOf:
                        - $ref: '#/components/schemas/CurrentMatch'
                        - type: "null"
            required:
                - match
            type: object
        CurrentMatch:
            properties:
                id:
                    format: uuid
                    type: string
                status:
                    type: string
                stream:
                    type: string
            required:
                - id
                - status
                - stream
            type: object
        DailyAnswerView:
            properties:
                correct:
                    type: boolean
                points:
                    type: integer
                position:
                    type: integer
                response_ms:
                    type:
                        - integer
                        - "null"
            required:
                - correct
                - points
                - position
                - response_ms
            type: object
        DailyBoard:
            properties:
                country:
                    type:
                        - string
                        - "null"
                day:
                    type: string
                entries:
                    items:
                        $ref: '#/components/schemas/DailyEntry'
                    type: array
                me:
                    oneOf:
                        - $ref: '#/components/schemas/DailyEntry'
                        - type: "null"
                next_cursor:
                    type:
                        - string
                        - "null"
                scope:
                    type: string
            required:
                - day
                - entries
                - me
                - next_cursor
                - scope
            type: object
        DailyEntry:
            properties:
                completed_at:
                    format: date-time
                    type: string
                correct_count:
                    type: integer
                rank:
                    type: integer
                total_time_ms:
                    type: integer
                user:
                    oneOf:
                        - $ref: '#/components/schemas/Card'
                        - type: "null"
                user_id:
                    format: uuid
                    type: string
            required:
                - completed_at
                - correct_count
                - rank
                - total_time_ms
                - user
                - user_id
            type: object
        DailyRunView:
            properties:
                answers:
                    items:
                        $ref: '#/components/schemas/DailyAnswerView'
                    type: array
                completed_at:
                    format: date-time
                    type:
                        - string
                        - "null"
                correct_count:
                    type:
                        - integer
                        - "null"
                day:
                    type: string
                id:
                    format: uuid
                    type: string
                kind:
                    type: string
                score:
                    type:
                        - integer
                        - "null"
                started_at:
                    format: date-time
                    type: string
                status:
                    type: string
                total_time_ms:
                    type:
                        - integer
                        - "null"
            required:
                - answers
                - completed_at
                - correct_count
                - day
                - id
                - kind
                - score
                - started_at
                - status
                - total_time_ms
            type: object
        DailyStart:
            properties:
                kind:
                    type: string
            required:
                - kind
            type: object
        DailyToday:
            properties:
                available:
                    type: boolean
                day:
                    type: string
                official:
                    oneOf:
                        - $ref: '#/components/schemas/DailyRunView'
                        - type: "null"
                practice_allowed:
                    type: boolean
            required:
                - available
                - day
                - official
                - practice_allowed
            type: object
        Decision:
            properties:
                accept:
                    type: boolean
                note:
                    type: string
            required:
                - accept
            type: object
        Deletion:
            properties:
                purge_after:
                    format: date-time
                    type: string
                requested_at:
                    format: date-time
                    type: string
            required:
                - purge_after
                - requested_at
            type: object
        Device:
            properties:
                app_version:
                    type: string
                installation_id:
                    type: string
                last_seen_at:
                    format: date-time
                    type: string
                locale:
                    type: string
                platform:
                    type: string
                push_enabled:
                    type: boolean
            required:
                - app_version
                - installation_id
                - last_seen_at
                - locale
                - platform
                - push_enabled
            type: object
        DeviceRequest:
            properties:
                app_version:
                    type: string
                fcm_token:
                    type:
                        - string
                        - "null"
                installation_id:
                    type: string
                locale:
                    type: string
                platform:
                    type: string
            required:
                - app_version
                - installation_id
                - locale
                - platform
            type: object
        EarnedBadge:
            properties:
                code:
                    type: string
                icon_key:
                    type: string
                name:
                    type: string
                tier:
                    type: integer
            required:
                - code
                - icon_key
                - name
                - tier
            type: object
        Entry:
            properties:
                couple:
                    oneOf:
                        - $ref: '#/components/schemas/CoupleLabel'
                        - type: "null"
                entity_id:
                    format: uuid
                    type: string
                rank:
                    type: integer
                score:
                    type: integer
                team:
                    oneOf:
                        - $ref: '#/components/schemas/Label'
                        - type: "null"
                user:
                    oneOf:
                        - $ref: '#/components/schemas/Card'
                        - type: "null"
            required:
                - entity_id
                - rank
                - score
            type: object
        ErrorEnvelope:
            properties:
                error:
                    properties:
                        code:
                            description: Stable code from docs/api/errors.md
                            type: string
                        details:
                            additionalProperties: true
                            type: object
                        message:
                            description: Localized fallback text (Accept-Language)
                            type: string
                        request_id:
                            format: uuid
                            type: string
                    required:
                        - code
                        - message
                        - request_id
                    type: object
            required:
                - error
            type: object
        Filed:
            properties:
                case_id:
                    format: uuid
                    type: string
                id:
                    format: uuid
                    type: string
            required:
                - case_id
                - id
            type: object
        Friend:
            properties:
                Card:
                    $ref: '#/components/schemas/Card'
                online:
                    type:
                        - boolean
                        - "null"
                since:
                    format: date-time
                    type: string
            required:
                - Card
                - online
                - since
            type: object
        FriendRequest:
            properties:
                created_at:
                    format: date-time
                    type: string
                expires_at:
                    format: date-time
                    type: string
                from_user_id:
                    format: uuid
                    type: string
                id:
                    format: uuid
                    type: string
                status:
                    type: string
                to_user_id:
                    format: uuid
                    type: string
                user:
                    $ref: '#/components/schemas/Card'
            required:
                - created_at
                - expires_at
                - from_user_id
                - id
                - status
                - to_user_id
                - user
            type: object
        FriendRequests:
            properties:
                requests:
                    items:
                        $ref: '#/components/schemas/FriendRequest'
                    type: array
            required:
                - requests
            type: object
        FriendsPage:
            properties:
                friends:
                    items:
                        $ref: '#/components/schemas/Friend'
                    type: array
                next_cursor:
                    format: uuid
                    type:
                        - string
                        - "null"
            required:
                - friends
                - next_cursor
            type: object
        History:
            properties:
                messages:
                    items:
                        $ref: '#/components/schemas/Message'
                    type: array
                next_cursor:
                    type:
                        - string
                        - "null"
            required:
                - messages
                - next_cursor
            type: object
        Inbox:
            properties:
                items:
                    items:
                        $ref: '#/components/schemas/Item'
                    type: array
                next_cursor:
                    type:
                        - string
                        - "null"
                unread:
                    type: integer
            required:
                - items
                - next_cursor
                - unread
            type: object
        Invite:
            properties:
                created_at:
                    format: date-time
                    type: string
                emblem_id:
                    type: string
                expires_at:
                    format: date-time
                    type: string
                id:
                    format: uuid
                    type: string
                invited_by:
                    $ref: '#/components/schemas/Card'
                team_id:
                    format: uuid
                    type: string
                team_name:
                    type: string
                team_tag:
                    type: string
            required:
                - created_at
                - emblem_id
                - expires_at
                - id
                - invited_by
                - team_id
                - team_name
                - team_tag
            type: object
        InviteCode:
            properties:
                code:
                    type: string
                expires_at:
                    format: date-time
                    type: string
                kind:
                    type: string
            required:
                - code
                - expires_at
                - kind
            type: object
        InviteCreated:
            properties:
                id:
                    format: uuid
                    type: string
            required:
                - id
            type: object
        InviteRequest:
            properties:
                user_id:
                    format: uuid
                    type: string
            required:
                - user_id
            type: object
        Invites:
            properties:
                invites:
                    items:
                        $ref: '#/components/schemas/Invite'
                    type: array
            required:
                - invites
            type: object
        Item:
            properties:
                body:
                    type: string
                category:
                    type: string
                created_at:
                    format: date-time
                    type: string
                deep_link:
                    type:
                        - string
                        - "null"
                id:
                    format: uuid
                    type: string
                kind:
                    type: string
                params:
                    additionalProperties:
                        type: string
                    type: object
                read:
                    type: boolean
                title:
                    type: string
            required:
                - body
                - category
                - created_at
                - deep_link
                - id
                - kind
                - params
                - read
                - title
            type: object
        JoinRequest:
            properties:
                code:
                    type: string
            required:
                - code
            type: object
        Label:
            properties:
                emblem_id:
                    type: string
                name:
                    type: string
                tag:
                    type: string
            required:
