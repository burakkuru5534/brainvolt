                - challenger
                - challenger_side
                - created_at
                - expires_at
                - id
                - kind
                - match_config
                - status
                - target
                - target_side
            type: object
        ChallengeRequest:
            properties:
                match_config:
                    $ref: '#/components/schemas/Config'
                target_couple_id:
                    format: uuid
                    type:
                        - string
                        - "null"
                target_user_id:
                    format: uuid
                    type:
                        - string
                        - "null"
            required:
                - match_config
            type: object
        Challenges:
            properties:
                challenges:
                    items:
                        $ref: '#/components/schemas/Challenge'
                    type: array
            required:
                - challenges
            type: object
        CodeRequest:
            properties:
                kind:
                    type: string
            required:
                - kind
            type: object
        Config:
            properties:
                aggregation:
                    type: string
                category_ids:
                    items:
                        format: uuid
                        type: string
                    type: array
                category_mode:
                    type: string
                format:
                    type: string
                match_type:
                    type: string
                origin:
                    type: string
                question_set_id:
                    format: uuid
                    type:
                        - string
                        - "null"
                quiz_length:
                    type: integer
                quiz_window_ms:
                    type: integer
                ranked_length:
                    type: boolean
                subcategory_id:
                    format: uuid
                    type:
                        - string
                        - "null"
                team_answer_mode:
                    type: string
            required:
                - format
                - match_type
                - origin
            type: object
        Counts:
            properties:
                casual:
                    type: integer
                ranked:
                    type: integer
            required:
                - casual
                - ranked
            type: object
        Couple:
            properties:
                activated_at:
                    format: date-time
                    type:
                        - string
                        - "null"
                created_at:
                    format: date-time
                    type: string
                expires_at:
                    format: date-time
                    type:
                        - string
                        - "null"
                id:
                    format: uuid
                    type: string
                name:
                    type:
                        - string
                        - "null"
                partners:
                    items:
                        $ref: '#/components/schemas/Card'
                    type: array
                requested_at:
                    format: date-time
                    type: string
                requested_by:
                    format: uuid
                    type: string
                status:
                    type: string
            required:
                - activated_at
                - created_at
                - id
                - name
                - partners
                - requested_at
                - requested_by
                - status
            type: object
        CoupleRequest:
            properties:
                name:
                    type:
                        - string
                        - "null"
                partner_user_id:
                    format: uuid
                    type: string
            required:
                - partner_user_id
            type: object
        Credit:
            properties:
                attribution_text:
                    type: string
                license_code:
                    type: string
                license_url:
                    type:
                        - string
                        - "null"
                name:
                    type: string
                share_alike:
                    type: boolean
                url:
                    type:
                        - string
                        - "null"
            required:
                - attribution_text
                - license_code
                - license_url
                - name
                - share_alike
                - url
            type: object
        Credits:
            properties:
                sources:
                    items:
                        $ref: '#/components/schemas/Credit'
                    type: array
            required:
                - sources
            type: object
        Current:
            properties:
                match:
                    oneOf:
                        - $ref: '#/components/schemas/CurrentMatch'
                        - type: "null"
            required:
                - match
            type: object
        CurrentMatch:
            properties:
