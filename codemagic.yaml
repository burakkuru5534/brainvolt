# Codemagic CI for BrainVolt iOS (D-057, D-110): builds the Flutter app on
# Codemagic's Macs and uploads it to TestFlight, so no local Mac/Xcode is
# needed. Works on a free personal account: signing is done by Codemagic's
# CLI from the variable group below (no Team "Code signing identities").
# Setup steps: mobile/README.md, "iOS build (Codemagic)".
workflows:
  ios-testflight:
    name: iOS → TestFlight
    max_build_duration: 60
    instance_type: mac_mini_m2
    working_directory: mobile
    # Manual starts only (no triggering block): each run is an upload.
    environment:
      flutter: 3.47.1 # .flutter-version (ADR-0001)
      xcode: latest
      cocoapods: default
      groups:
        # App → Environment variables, group "app_store" (all secure):
        # APP_STORE_CONNECT_ISSUER_ID, APP_STORE_CONNECT_KEY_IDENTIFIER,
        # APP_STORE_CONNECT_PRIVATE_KEY (the .p8 contents),
        # CERTIFICATE_PRIVATE_KEY (RSA key of the distribution certificate).
        - app_store
      vars:
        BUNDLE_ID: com.brainvolt.app
    scripts:
      - name: Flutter packages
        script: flutter pub get
      - name: Code signing
        script: |
          keychain initialize
          # Finds (or creates) the Apple Distribution certificate and the
          # App Store profile for the bundle id through the API key.
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --create
          keychain add-certificates
          xcode-project use-profiles
      - name: Build IPA
        script: |
          # Codemagic's run counter keeps iOS build numbers increasing; the
          # version name (1.0.0) comes from pubspec.yaml.
          flutter build ipa --release \
            --dart-define-from-file=env/prod.json \
            --build-number=$PROJECT_BUILD_NUMBER \
            --export-options-plist=/Users/builder/export_options.plist
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM
    publishing:
      app_store_connect:
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY
        key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        submit_to_testflight: true
